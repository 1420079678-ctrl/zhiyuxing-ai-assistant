services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhiyuxing-ai-assistant:latest
    container_name: zhiyuxing-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CHAT_DB_PATH=/app/data/zhiyuxing.db
      - ENVIRONMENT=production
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./knowledge_base/uploads:/app/knowledge_base/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: zhiyuxing-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  zhiyuxing_data:
