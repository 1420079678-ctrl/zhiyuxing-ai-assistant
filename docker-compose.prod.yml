services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhiyuxing-ai-assistant:v1.0.0
    container_name: zhiyuxing-api-prod
    restart: always
    environment:
      - CHAT_DB_PATH=/app/data/zhiyuxing.db
      - ENVIRONMENT=production
      - API_KEY_AUTH_ENABLED=false
    env_file:
      - path: .env.production
        required: false
      - path: .env
        required: false
    volumes:
      - zhiyuxing_db_data:/app/data
      - zhiyuxing_uploads:/app/knowledge_base/uploads
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: zhiyuxing-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy

volumes:
  zhiyuxing_db_data:
    driver: local
  zhiyuxing_uploads:
    driver: local
