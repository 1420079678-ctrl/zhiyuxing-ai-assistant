name: Build Release Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version or tag, for example v0.7.0
        required: false
        type: string
  release:
    types:
      - published

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="snapshot-${GITHUB_SHA::7}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release bundle
        run: python scripts/build_release_bundle.py --version "${{ steps.version.outputs.value }}" --output-dir dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ steps.version.outputs.value }}
          path: dist/*

      - name: Upload bundle to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
