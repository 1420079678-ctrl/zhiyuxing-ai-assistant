user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate limiting zone (100 req/min per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream zhiyuxing_backend {
        server api:8000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        client_max_body_size 20M;

        # Static asset caching
        location /static/ {
            proxy_pass http://zhiyuxing_backend/static/;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # Server-Sent Events (SSE) streaming endpoint: disable buffering
        location /chat/stream {
            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://zhiyuxing_backend/chat/stream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Critical for real-time SSE streaming
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 300s;
        }

        # Main API and Frontend Proxy
        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://zhiyuxing_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Healthcheck endpoint (no rate limit)
        location /health {
            proxy_pass http://zhiyuxing_backend/health;
            access_log off;
        }

        # Prometheus metrics endpoint (internal or monitoring)
        location /metrics {
            proxy_pass http://zhiyuxing_backend/metrics;
        }
    }
}
